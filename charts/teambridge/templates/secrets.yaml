apiVersion: v1
kind: Secret
metadata:
  name: teambridge-secrets
  labels:
    {{- include "teambridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  mariadb-root-password: "rootpassword123"
  mariadb-password: "wordpresspassword123"
  woo-consumer-key: {{ .Values.store.wooConsumerKey | quote }}
  woo-consumer-secret: {{ .Values.store.wooConsumerSecret | quote }}
  hmac-secret: {{ .Values.gateway.hmacSecret | quote }}
  llm-api-key: {{ .Values.gateway.llm.apiKey | quote }}
